# NOTE (2026-08-07): this workflow existed since the initial publish but had never actually run —
# zero runs recorded on this repo before this comment was added. The Actions API confirmed it was
# in a disabled state (re-enabled via PUT /repos/.../actions/workflows/{id}/enable); this is why
# the "single hardcoded migration" bug below never surfaced in a real CI check, on top of the fix
# in this same commit history. If CI silently stops running again, check Settings > Actions first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEOPLE_MEMORY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra api --extra dev --locked
      - name: Stub Supabase auth (roles/schema the migrations expect)
        run: |
          psql "$PEOPLE_MEMORY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin noinherit;
          create role authenticated nologin noinherit;
          create schema if not exists auth;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          SQL
      - name: Apply migrations
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "$PEOPLE_MEMORY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: uv run ruff check .
      - run: uv run pytest --cov=people_memory --cov-report=term-missing
      # The dashboard ships as one dependency-free index.html, so its markdown renderer is tested
      # with node's own runner against the real source pulled out of that file. Uses the Node
      # already on the runner; the shell expands the glob, so no test-runner glob support needed.
      - name: Test the dashboard markdown renderer
        run: node --test web/tests/*.test.mjs
