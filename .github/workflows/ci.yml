name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEOPLE_MEMORY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra api --extra dev --locked
      - name: Apply core schema
        run: psql "$PEOPLE_MEMORY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260803000000_core.sql
      - run: uv run ruff check .
      - run: uv run pytest --cov=people_memory --cov-report=term-missing
